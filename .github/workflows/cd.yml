name: CD

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: ./.github/actions/setup-project

      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match svelte-m3c@${pkg}"
              exit 1
          fi

      - name: Build package
        run: pnpm run build

      - name: Configure npm auth
        run: pnpm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}

      - name: Publish
        run: |
          pkg=$(node -p "require('./package.json').version")
          if pnpm view "svelte-m3c@${pkg}" version > /dev/null 2>&1; then
              echo "::notice::svelte-m3c@${pkg} is already on the registry; skipping"
              exit 0
          fi
          pnpm publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"
