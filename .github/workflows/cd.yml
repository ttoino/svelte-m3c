name: CD

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-project

      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match svelte-m3c@${pkg}"
              exit 1
          fi
      - name: Publish to npm
        run: |
          pkg=$(node -p "require('./package.json').version")
          if pnpm view "svelte-m3c@${pkg}" version > /dev/null 2>&1; then
              echo "::notice::svelte-m3c@${pkg} is already on the registry; skipping"
              exit 0
          fi
          pnpm publish --access public --no-git-checks
