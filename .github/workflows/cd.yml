name: CD

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-project

      - name: Verify tag matches package version
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Generate Cloudflare types
        run: pnpm run gen:cf-types

      - name: Build package
        run: pnpm run build

      - name: Configure npm auth
        run: pnpm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}

      - name: Publish
        run: |
          pkg=$(node -p "require('./package.json').version")
          if pnpm view "svelte-m3c@${pkg}" version > /dev/null 2>&1; then
              echo "::notice::svelte-m3c@${pkg} is already on the registry; skipping"
              exit 0
          fi
          pnpm publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"
