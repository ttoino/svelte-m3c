name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: ./.github/actions/setup-project
      - run: pnpm run format

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: ./.github/actions/setup-project
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: ./.github/actions/setup-project
      - run: pnpm run gen:cf-types
      - run: pnpm run check

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: ./.github/actions/setup-project

      - run: pnpm exec playwright install --with-deps

      - run: pnpm run test

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: ./.github/actions/setup-project
      - run: pnpm run build
